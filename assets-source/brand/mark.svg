<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Clockwork Spire</title>
  <defs>
    <linearGradient id="gear-brass" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#f6dc8e"/>
      <stop offset="0.45" stop-color="#dec16a"/>
      <stop offset="1" stop-color="#7a5522"/>
    </linearGradient>
    <linearGradient id="spire-brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5522"/>
      <stop offset="0.38" stop-color="#f6dc8e"/>
      <stop offset="0.62" stop-color="#dec16a"/>
      <stop offset="1" stop-color="#6b4a1f"/>
