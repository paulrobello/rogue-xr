  <circle cx="32" cy="37" r="14.4" fill="none" stroke="#f6dc8e" stroke-width="0.9" opacity="0.5"/>
  <g stroke="#120c07" stroke-width="2.6" stroke-linejoin="round" paint-order="stroke">
    <!-- The spire: roof, lantern stage, ledge, tapering shaft, plinth. -->
    <path fill="url(#spire-brass)" d="M32 2.5L37 17.5L36.2 17.5L36.2 25.5L38 25.5L38 28.5L35.4 28.5L36.6 54.5L39.5 54.5L39.5 59.5L24.5 59.5L24.5 54.5L27.4 54.5L28.6 28.5L26 28.5L26 25.5L27.8 25.5L27.8 17.5L27 17.5Z"/>
