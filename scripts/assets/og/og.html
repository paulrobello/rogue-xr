<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clockwork Spire share card</title>
    <!-- Rendered at 1200x630, DPR 1, by render-og.py. Paths are relative to this file. -->
    <style>
      @font-face {
        font-family: 'Spire Noto Sans';
        src: url('../../../public/fonts/NotoSans-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
      }
      :root {
        --void: #120c07;
        --warm-black: #231d1a;
        --brass: #dec16a;
        --brass-light: #f6dc8e;
        --candle: #f3be65;
        --parchment: #f2dfb8;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--void);
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Spire Noto Sans', sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }
      /* Key art scaled to 1200 wide (675 tall); the 45 px overflow is cut from the bottom so the
         glow at the top of the spiral stays in frame. */
      .art {
        position: absolute;
        left: 0;
        top: 0;
        width: 1200px;
        height: 675px;
        display: block;
      }
      /* Darken the quiet left wall further for the title; the right two thirds stay untouched. */
      .scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgb(18 12 7 / 0.9) 0%,
            rgb(18 12 7 / 0.82) 28%,
            rgb(18 12 7 / 0.6) 46%,
            rgb(18 12 7 / 0) 64%
          ),
          linear-gradient(180deg, rgb(18 12 7 / 0) 70%, rgb(18 12 7 / 0.55) 100%);
      }
      .lockup {
        position: absolute;
        left: 76px;
        top: 0;
        bottom: 0;
        width: 520px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .mark {
        width: 96px;
        height: 96px;
        margin: 0 0 26px -6px;
        filter: drop-shadow(0 6px 10px rgb(0 0 0 / 0.55));
      }
      h1 {
        margin: 0;
        color: var(--brass);
        font-weight: 400;
        font-size: 84px;
        line-height: 0.98;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-shadow:
          0 3px 0 rgb(18 12 7 / 0.9),
          0 8px 22px rgb(0 0 0 / 0.6);
      }
      h1 span {
        display: block;
      }
      .rule {
        width: 132px;
        height: 2px;
        margin: 30px 0 24px;
        background: var(--candle);
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.6);
      }
      p {
        margin: 0;
        max-width: 430px;
        color: var(--parchment);
        font-size: 29px;
        line-height: 1.3;
        text-shadow: 0 2px 8px rgb(0 0 0 / 0.75);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="art" src="../../../public/assets/ui/title-2048.jpg" alt="" />
      <div class="scrim"></div>
      <div class="lockup">
        <img class="mark" src="../../../assets-source/brand/mark.svg" alt="" />
        <h1><span>Clockwork</span><span>Spire</span></h1>
        <div class="rule"></div>
        <p>A seated VR roguelike deckbuilder for Meta&nbsp;Quest&nbsp;3</p>
      </div>
    </div>
  </body>
</html>
